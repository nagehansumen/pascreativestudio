<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,follow"><title>Sayfa bulunamadı | PAS</title><style>
:root{
  --bg:#efefef; --ink:#0f1435; --lime:#cce86b; --pink:#f2c4cd;
  --grey:#dcdcdc; --rule:rgba(15,20,53,.2); --muted:rgba(15,20,53,.6);
  --wine:#33000d; --gold:#c6b14b; --ivory:#f3ede3;
  --m:clamp(16px,3.2vw,44px); --gut:clamp(12px,1.6vw,24px);
  --ease:cubic-bezier(.7,0,.2,1); --ease-out:cubic-bezier(.2,.7,.1,1);
  --f:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --head:72px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.5;
  font-feature-settings:"ss01","tnum" 0;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,ol,figure{margin:0;padding:0}
ul,ol{list-style:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.on-ink :focus-visible,.foot :focus-visible{outline-color:var(--lime)}
.music :focus-visible{outline-color:var(--gold)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* type */
.wordmark{font-weight:700;font-stretch:88%;letter-spacing:-.035em;line-height:1}
.meta{font-size:13px;line-height:1.4;color:var(--muted);letter-spacing:.005em}
.h2{font-size:clamp(34px,4.6vw,68px);font-weight:600;font-stretch:84%;letter-spacing:-.025em;line-height:.95}
.lead{font-size:clamp(19px,1.7vw,24px);line-height:1.38;letter-spacing:-.01em;max-width:34em}
.btn{display:inline-flex;align-items:center;gap:.6em;min-height:48px;padding:0 22px;border:1px solid var(--ink);
  font-size:15px;font-weight:500;transition:background .35s var(--ease-out),color .35s var(--ease-out)}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn--solid{background:var(--ink);color:var(--bg)}
.btn--solid:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.link{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .45s var(--ease-out)}
.link:hover{background-size:100% 1px}
.dot{display:inline-block;width:.34em;height:.34em;border-radius:50%;background:currentColor;vertical-align:.18em;margin:0 .9em}

.wrap{padding-inline:var(--m)}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut)}

/* cursor */
#cursor{position:fixed;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;color:var(--ink);background:currentColor;border:1.5px solid currentColor;
  pointer-events:none;z-index:300;transition:width .3s var(--ease-out),height .3s var(--ease-out),margin .3s var(--ease-out),opacity .3s,background-color .3s,color .3s;opacity:0}
#cursor.is-light{color:var(--lime)}
#cursor.is-gold{color:var(--gold)}
html.has-cursor, html.has-cursor a, html.has-cursor button{cursor:none}
html.has-cursor #cursor{opacity:1}
#cursor.is-big{width:52px;height:52px;margin:-26px 0 0 -26px;background:transparent}

/* wipe */
#wipe{position:fixed;inset:0;z-index:200;pointer-events:none;clip-path:inset(100% 0 0 0);display:grid;place-items:center;background:var(--ink);color:var(--bg)}
#wipe span{font-size:clamp(48px,9vw,140px)}

/* ============ ENTRY ============ */
#v-entry{display:none}
html.at-entry #v-entry{display:flex}
html.at-entry body{overflow:hidden}
.entry{position:fixed;inset:0;z-index:100;height:100vh;height:100svh;flex-direction:column;overflow:hidden;background:var(--bg)}
.entry-top{display:grid;grid-template-columns:1fr auto;align-items:end;padding:22px var(--m) 20px;border-bottom:1px solid var(--rule)}
.entry-top .wordmark{font-size:clamp(40px,5.4vw,84px)}
.entry-q{font-size:15px;font-weight:500;padding-bottom:.35em}
.entry-meta{justify-self:end;text-align:right;padding-bottom:.35em}
.split{flex:1;display:flex;min-height:0}
.half{position:relative;flex:1 1 0;min-width:0;overflow:hidden;display:flex;align-items:flex-end;
  transition:flex-grow .8s var(--ease),color .5s var(--ease-out)}
.half + .half{border-left:1px solid var(--rule)}
.half-bg{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease-out)}
.half--creative .half-bg{background:
  repeating-linear-gradient(90deg,rgba(15,20,53,.12) 0 1px,transparent 1px calc(100%/6)),
  repeating-linear-gradient(0deg,rgba(15,20,53,.12) 0 1px,transparent 1px 96px),var(--lime)}
.half--music .half-bg{background:var(--wine)}
.half-inner{position:relative;padding:0 var(--m) clamp(24px,4vh,48px);display:grid;gap:14px;width:100%}
.half-label{font-size:clamp(46px,8.6vw,156px);font-weight:600;font-stretch:75%;letter-spacing:-.03em;line-height:.86;
  transition:font-stretch .8s var(--ease),letter-spacing .8s var(--ease),transform .8s var(--ease);transform-origin:0 100%;white-space:nowrap}
.half-label small{display:block;font-size:.42em;font-weight:700;font-stretch:88%;letter-spacing:-.03em;margin-bottom:.12em}
.half-desc{font-size:15px}
.half-act{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;margin-top:6px}
.half-act i{display:inline-block;width:28px;height:1px;background:currentColor;transition:width .6s var(--ease)}
.split[data-hover="creative"] .half--creative,.split[data-hover="music"] .half--music{flex-grow:1.45}
.split[data-hover] .half .half-bg{opacity:0}
.split[data-hover="creative"] .half--creative .half-bg,.split[data-hover="music"] .half--music .half-bg{opacity:1}
.split[data-hover="music"] .half--music{color:var(--ivory)}
.split[data-hover="creative"] .half--creative .half-label,.split[data-hover="music"] .half--music .half-label{font-stretch:100%;letter-spacing:-.04em}
.split[data-hover="creative"] .half--music,.split[data-hover="music"] .half--creative{color:rgba(15,20,53,.4)}
.split[data-hover="creative"] .half--music .half-label,.split[data-hover="music"] .half--creative .half-label{transform:scale(.78)}
.split[data-hover] .half:is(:hover,:focus-visible) .half-act i{width:64px}
.split[data-chosen="creative"] .half--creative,.split[data-chosen="music"] .half--music{flex-grow:40}
.split[data-chosen] .half-inner{opacity:0;transition:opacity .3s}
.split[data-chosen="creative"] .half--creative .half-bg,.split[data-chosen="music"] .half--music .half-bg{opacity:1}

/* sound lines (shared) */
.lines{position:absolute;left:0;right:0;bottom:0;height:72%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 var(--m);pointer-events:none}
.lines b{flex:0 0 2px;height:100%;display:flex;align-items:flex-end;transition:height .9s var(--ease-out)}
.lines b i{display:block;width:100%;height:100%;transform-origin:50% 100%;
  background:linear-gradient(to top,rgba(243,237,227,0),rgba(243,237,227,.42) 30%,rgba(243,237,227,.1));
  animation:eq var(--d,2.4s) ease-in-out var(--dl,0s) infinite alternate;transform:scaleY(var(--a,.2))}
.lines b.l i{background:linear-gradient(to top,rgba(198,177,75,0),rgba(198,177,75,.95) 30%,rgba(198,177,75,.18))}
@keyframes eq{from{transform:scaleY(var(--a,.2))}to{transform:scaleY(var(--b,.6))}}

/* ============ MUSIC ============ */
.music{--m-rule:rgba(243,237,227,.16);--m-mute:rgba(243,237,227,.64);
  background:var(--wine);color:var(--ivory);position:relative;display:block}
.music .meta{color:var(--m-mute)}
.music .btn{border-color:rgba(243,237,227,.45)}
.music .btn:hover{background:var(--ivory);color:var(--wine);border-color:var(--ivory)}
.music .btn--solid{background:var(--gold);color:var(--wine);border-color:var(--gold)}
.music .btn--solid:hover{background:var(--ivory);border-color:var(--ivory)}
.m-sec{padding-inline:var(--m);padding-block:clamp(72px,9vw,140px)}
.m-sec + .m-sec{padding-top:0}
.m-lab{font-size:13px;font-weight:500;color:var(--gold);letter-spacing:.02em}
.m-h2{font-size:clamp(32px,4.4vw,64px);font-weight:600;font-stretch:84%;letter-spacing:-.025em;line-height:.98}

/* music header */
.m-head{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:16px var(--m);background:var(--wine);border-bottom:1px solid var(--m-rule)}
.m-brand{display:flex;align-items:baseline;gap:10px}
.m-brand .wordmark{font-size:28px}
.m-brand span{font-size:13px;color:var(--gold)}
.m-nav{display:flex;align-items:center;gap:clamp(14px,1.8vw,28px);font-size:15px;font-weight:500;flex-wrap:wrap;justify-content:flex-end}
.m-nav .sep{width:1px;height:16px;background:var(--m-rule)}

/* hero */
.m-hero{position:relative;min-height:calc(100svh - 61px);display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;padding:clamp(48px,9vw,120px) var(--m) clamp(36px,5vh,60px)}
.m-hero > *:not(.lines){position:relative;z-index:2}
.m-hero .lines{height:70%;z-index:1;opacity:.85;
  -webkit-mask-image:linear-gradient(to top,#000 0 34%,rgba(0,0,0,.45) 62%,transparent 92%);
  mask-image:linear-gradient(to top,#000 0 34%,rgba(0,0,0,.45) 62%,transparent 92%)}
.m-hero-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:auto}
.m-hero h1{font-size:clamp(50px,9.4vw,168px);font-weight:600;font-stretch:76%;letter-spacing:-.035em;line-height:.86;
  margin-block:clamp(28px,6vh,72px) 22px}
.m-hero h1 em{font-style:normal;display:block}
.m-hero .lead{max-width:24em}
.m-hero-act{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(24px,3vw,36px)}

/* intro */
.m-intro{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);row-gap:20px;align-items:start}
.m-intro .m-h2{grid-column:1/5}
.m-intro p{grid-column:5/12;font-size:clamp(19px,1.8vw,26px);line-height:1.36;letter-spacing:-.012em}

/* services */
.m-svc-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;
  border-bottom:1px solid var(--gold);padding-bottom:14px}
.m-svc{margin-top:4px}
.m-svc li{border-bottom:1px solid var(--m-rule);position:relative;overflow:hidden}
.m-svc li span{display:block;padding:clamp(12px,1.4vw,20px) 0;font-size:clamp(24px,3.1vw,46px);font-weight:500;
  font-stretch:84%;letter-spacing:-.02em;line-height:1.08;transition:transform .55s var(--ease),color .3s}
.m-svc li::before{content:"";position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:0 50%;
  transition:transform .55s var(--ease)}
.m-svc li:hover::before{transform:scaleX(1)}
.m-svc li:hover span{transform:translateX(clamp(12px,2vw,30px));color:var(--wine)}
.m-svc-note{margin-top:26px;max-width:40em;color:var(--m-mute)}

/* studio image */
.m-fig{margin:0;padding-inline:var(--m)}
.m-fig img{width:100%;aspect-ratio:16/7;object-fit:cover;object-position:50% 52%}
.m-fig figcaption{display:flex;justify-content:space-between;gap:20px;margin-top:12px}

/* equipment */
.m-eq-head{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);row-gap:14px;
  align-items:end;margin-bottom:clamp(32px,4vw,56px)}
.m-eq-head .m-h2{grid-column:1/7}
.m-eq-head p{grid-column:8/13;color:var(--m-mute)}
.m-eq{column-count:3;column-gap:clamp(26px,3vw,48px)}
.m-eq > div{display:inline-block;width:100%;break-inside:avoid;-webkit-column-break-inside:avoid;
  border-top:1px solid var(--gold);padding-top:12px;margin-bottom:clamp(28px,3.2vw,48px)}
.m-eq h3{font-size:13px;font-weight:600;color:var(--gold);letter-spacing:.08em;margin-bottom:6px}
.m-eq li{padding:8px 0;border-bottom:1px solid var(--m-rule);font-size:16px;line-height:1.3}
.m-eq li:last-child{border-bottom:0}
.m-eq li.sub{padding-left:16px;font-size:15px;color:var(--m-mute)}

/* contact */
.m-ct{border-top:1px solid var(--m-rule)}
.m-ct h2{font-size:clamp(38px,6.6vw,110px);font-weight:600;font-stretch:76%;letter-spacing:-.04em;line-height:.9;max-width:14em}
.m-ct-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);row-gap:28px;
  margin-top:clamp(36px,4.5vw,64px);align-items:start}
.m-ct-lines{grid-column:1/7;display:grid;gap:8px;justify-items:start}
.m-ct-lines a{font-size:clamp(20px,2.2vw,32px);font-weight:500;font-stretch:88%;letter-spacing:-.02em}
.m-ct-side{grid-column:8/13;display:grid;gap:10px;justify-items:start}
.m-ct-side address{font-style:normal;line-height:1.5}
.m-ct-side .m-ct-act{margin-top:16px}
.m-ct-act{display:flex;flex-wrap:wrap;gap:12px}

/* music footer */
.m-foot{padding:clamp(40px,5vw,72px) var(--m) 26px;border-top:1px solid var(--m-rule)}
.m-foot .wordmark{font-size:clamp(80px,18vw,320px);letter-spacing:-.05em;line-height:.8;margin-left:-.04em}
.m-foot .wordmark b{font-weight:inherit;color:var(--gold)}
.m-foot-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gut);row-gap:26px;
  margin-top:clamp(32px,4vw,56px);border-top:1px solid var(--m-rule);padding-top:18px;font-size:15px}
.m-foot-grid > div{display:grid;gap:4px;justify-items:start;align-content:start}
.m-foot-bottom{margin-top:44px;display:flex;justify-content:space-between;gap:20px;font-size:13px;color:var(--m-mute)}

/* ============ CREATIVE ============ */
.head{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--head);display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--m);background:var(--bg);transition:box-shadow .3s}
.head.is-scrolled{box-shadow:0 1px 0 var(--rule)}
.head-brand{display:flex;align-items:center}
.brand-logo{display:block;width:clamp(92px,8.6vw,110px);height:auto}
.mnav .brand-logo,.foot .brand-logo{--l1:#efefef}
.nav{display:flex;gap:clamp(14px,1.8vw,30px);font-size:15px;font-weight:500}
.nav a{position:relative;padding:6px 0}
.nav a::after{content:"";position:absolute;left:50%;bottom:-2px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .35s var(--ease-out)}
.nav a.is-active::after{transform:scale(1)}
.head-side{display:flex;align-items:center;gap:22px;font-size:15px;font-weight:500}
.menu-btn{display:none;min-height:44px;padding:0 4px;font-size:15px;font-weight:500}
.mnav{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--bg);padding:18px var(--m) 32px;display:flex;flex-direction:column}
.mnav-top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.mnav ul{margin-top:auto;display:grid;gap:4px}
.mnav ul a{display:block;font-size:clamp(38px,11vw,64px);font-weight:600;font-stretch:80%;letter-spacing:-.03em;line-height:1.05;padding:4px 0}
.mnav .meta{color:rgba(239,239,239,.6);margin-top:28px}

section{scroll-margin-top:var(--head)}
.sec{padding-block:clamp(88px,11vw,176px)}
.sec-head{align-items:end;margin-bottom:clamp(40px,5vw,80px)}

/* hero */
.hero{min-height:100vh;min-height:100svh;padding-top:calc(var(--head) + clamp(20px,3vw,44px));display:flex;flex-direction:column}
.hero-top{align-items:start}
.hero-top .eyebrow{grid-column:1/7;font-size:15px;font-weight:500}
.hero-top .clock-wrap{grid-column:9/13;justify-self:end;text-align:right}
.hero-mid{flex:1;align-items:end;padding-block:clamp(40px,6vw,80px) clamp(28px,3vw,44px)}
.hero h1{grid-column:1/9;font-size:clamp(46px,7.6vw,138px);font-weight:600;font-stretch:78%;letter-spacing:-.03em;line-height:.9}
.h-line{display:block;overflow:hidden;padding-bottom:.04em}
.h-line > span{display:block;transform:translateY(105%);transition:transform 1.1s var(--ease-out)}
.hero.is-in .h-line > span{transform:none}
.hero.is-in .h-line:nth-child(2) > span{transition-delay:.09s}
.hero.is-in .h-line:nth-child(3) > span{transition-delay:.18s}
.hero-fig{grid-column:9/13;align-self:end}
.hero-fig .frame{overflow:hidden;clip-path:inset(0 0 100% 0);transition:clip-path 1.2s var(--ease) .3s}
.hero.is-in .hero-fig .frame{clip-path:inset(0)}
.hero-fig img{width:100%;height:auto;display:block}
.hero-fig img,.cs-grid img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.hero-fig figcaption{margin-top:10px}
.hero-bottom{border-top:1px solid var(--rule);padding-block:24px 28px;align-items:start;row-gap:24px}
.hero-bottom p{grid-column:1/6;font-size:clamp(17px,1.35vw,20px);line-height:1.45;max-width:32em}
.hero-cta{grid-column:8/13;justify-self:end;display:flex;gap:12px;flex-wrap:wrap}
.ticker{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow:hidden;white-space:nowrap;font-size:14px;font-weight:500;padding:11px 0}
.ticker-track{display:inline-flex;animation:tick 60s linear infinite}
.ticker-track span{padding-right:0}
@keyframes tick{to{transform:translateX(-50%)}}

/* studio / services */
.svc-list{grid-column:4/13;border-top:1px solid var(--ink)}
.svc-list li{position:relative;border-bottom:1px solid var(--rule);overflow:hidden}
.svc-list li span{position:relative;display:block;padding:clamp(14px,1.5vw,22px) 0;font-size:clamp(26px,3.3vw,50px);font-weight:500;font-stretch:84%;letter-spacing:-.02em;line-height:1.08;
  transition:transform .6s var(--ease)}
.svc-list li::before{content:"";position:absolute;inset:0;background:var(--lime);transform:scaleX(0);transform-origin:0 50%;transition:transform .6s var(--ease)}
.svc-list li:hover::before{transform:scaleX(1)}
.svc-list li:hover span{transform:translateX(clamp(12px,2vw,32px))}
.svc-aside{grid-column:1/4}
.svc-aside .h2{margin-bottom:18px;font-size:clamp(34px,3.6vw,56px);padding-right:1em}

/* works */
.works-grid{row-gap:clamp(56px,7vw,120px);align-items:start}
.work{cursor:pointer;display:block;text-align:left;width:100%}
.work-tile{position:relative;overflow:hidden;background:var(--grey)}
.work-tile .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,1.6vw,24px);transition:transform 1.2s var(--ease-out)}
.work-tile .ph b{font-size:clamp(34px,5.4vw,96px);font-weight:600;font-stretch:75%;letter-spacing:-.035em;line-height:.86;max-width:9ch}
.work-tile .ph em{font-style:normal;font-size:13px;align-self:flex-end;opacity:.7}
.work-tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease-out)}
.work:hover .work-tile .ph,.work:hover .work-tile img{transform:scale(1.03)}
.work-over{position:absolute;left:0;right:0;bottom:0;padding:clamp(14px,1.6vw,24px);background:var(--ink);color:var(--bg);font-size:15px;line-height:1.45;
  transform:translateY(101%);transition:transform .6s var(--ease)}
.work:hover .work-over,.work:focus-visible .work-over{transform:none}
.work-meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:0 .45em;font-size:14px}
.work-meta b{font-weight:600}
.work-meta span{color:var(--muted)}
.t-pink{background:var(--pink)} .t-ink{background:var(--ink);color:var(--bg)} .t-lime{background:var(--lime)} .t-grey{background:var(--grey)}
.w1{grid-column:1/8}.w1 .work-tile{aspect-ratio:6/5}
.w2{grid-column:9/13;margin-top:clamp(80px,16vw,280px)}.w2 .work-tile{aspect-ratio:4/5}
.w3{grid-column:2/7}.w3 .work-tile{aspect-ratio:1/1}
.w4{grid-column:8/13;margin-top:clamp(60px,10vw,180px)}.w4 .work-tile{aspect-ratio:4/3}
.w5{grid-column:4/13}.w5 .work-tile{aspect-ratio:2/1}

/* paslastik */
.pas-sec{padding-block:clamp(88px,11vw,176px) clamp(72px,9vw,140px);overflow:hidden}
.pas-title{font-size:clamp(64px,15.5vw,280px);font-weight:600;font-stretch:75%;letter-spacing:-.045em;line-height:.8;margin-left:-.04em;padding-bottom:.1em}
.pas-sub{margin-top:18px;justify-content:space-between}
.marquee{--logo-base:clamp(34px,4.4vw,62px);margin-top:clamp(48px,6vw,96px);display:grid;gap:clamp(28px,4vw,56px)}
.m-row{overflow:hidden;padding-block:6px}
.m-track{display:flex;width:max-content;will-change:transform}
.m-group{display:flex;align-items:center;width:max-content}
.m-logo{flex:0 0 auto;padding-inline:calc(var(--logo-base)*.85);display:flex;align-items:center;color:var(--ink)}
.m-logo svg{display:block;height:calc(var(--logo-base)*var(--f));width:calc(var(--logo-base)*var(--f)*var(--ar));fill:currentColor}
.reduce .m-track{transform:none!important}

/* creative space */
.cs-head .meta{grid-column:1/4;color:var(--ink);font-size:15px;font-weight:500;align-self:start;padding-top:.6em}
.cs-head .h2{grid-column:4/13}
.cs-intro{grid-column:4/11;margin-top:22px}
.cs-figwrap{margin-top:clamp(36px,4.5vw,64px)}
.cs-fig{grid-column:4/13;clip-path:inset(0 4% 0 4%);transition:clip-path 1.2s var(--ease)}
.cs-fig.is-in{clip-path:inset(0)}
.cs-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gut)}
.cs-grid img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;display:block}
.cs-cap{grid-column:4/13;margin-top:12px;display:flex;justify-content:space-between;gap:20px}
.cs-desc{grid-column:4/11;margin-top:clamp(40px,5vw,72px)}
.cs-cols{margin-top:clamp(48px,6vw,88px);row-gap:36px}
.cs-cols article{grid-column:span 4;border-top:1px solid var(--ink);padding-top:16px}
.cs-cols h3{font-size:clamp(22px,1.9vw,28px);font-weight:600;font-stretch:88%;letter-spacing:-.015em;margin-bottom:10px}
.cs-cols p{max-width:30em;color:rgba(15,20,53,.8)}
.cs-cta{margin-top:clamp(40px,5vw,64px)}

/* prompts */
.pr-sec{background:#e6e6e6}
.pr-head .h2{grid-column:1/8}
.pr-head .lead{grid-column:8/13;font-size:17px;align-self:end}
.filters{display:grid;gap:14px;margin-bottom:28px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.frow > .meta{width:72px;flex:0 0 72px;color:var(--ink)}
.chip{min-height:38px;padding:0 14px;border:1px solid var(--rule);font-size:14px;font-weight:500;transition:background .25s,border-color .25s,color .25s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip sup{font-size:10px;margin-left:3px;opacity:.6}
.pr-count{display:flex;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-top:8px}
.pr-list li{border-bottom:1px solid var(--rule)}
.pr-row{display:grid;grid-template-columns:78px minmax(0,1.6fr) minmax(0,.7fr) minmax(0,.7fr) auto;gap:var(--gut);align-items:center;padding:18px 0;position:relative}
.pr-row::before{content:"";position:absolute;inset:0 calc(var(--m)*-1);background:var(--lime);opacity:0;transition:opacity .25s;z-index:0}
.pr-row:hover::before{opacity:1}
.pr-row > *{position:relative;z-index:1}
.pr-open{text-align:left;display:grid;gap:4px}
.pr-open b{font-size:clamp(19px,1.6vw,23px);font-weight:600;font-stretch:90%;letter-spacing:-.01em;line-height:1.2}
.pr-open span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52ch}
.pr-id{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pr-tool,.pr-cat{font-size:14px}
.pr-acts{display:flex;gap:6px}
.pr-acts button{min-height:38px;padding:0 12px;font-size:13px;font-weight:500;border:1px solid var(--rule);background:var(--bg);transition:background .2s,color .2s}
.pr-acts button:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pr-empty{padding:40px 0;display:grid;gap:12px;justify-items:start}

/* drawer */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(15,20,53,.35);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.is-open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:95;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--ink);
  transform:translateX(102%);transition:transform .6s var(--ease);overflow-y:auto;overscroll-behavior:contain;visibility:hidden}
.drawer.is-open{transform:none;visibility:visible}
.dr-top{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:14px var(--m);border-bottom:1px solid var(--rule);z-index:2}
.dr-body{padding:28px var(--m) 48px;display:grid;gap:28px}
.dr-body h3{font-size:clamp(30px,3vw,44px);font-weight:600;font-stretch:82%;letter-spacing:-.025em;line-height:1}
.dr-specs{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;font-size:15px}
.dr-specs dt{color:var(--muted)}
.dr-specs dd{margin:0;font-weight:500}
.dr-prompt{background:var(--ink);color:var(--bg);padding:20px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.dr-label{font-size:13px;color:var(--muted);margin-bottom:10px}
.dr-result{aspect-ratio:4/5;background:var(--grey);display:grid;place-items:center;text-align:center;padding:24px;scroll-margin-top:80px}
.dr-result.video{aspect-ratio:16/9}
.dr-result.flash{animation:flash 1s var(--ease-out)}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--lime)}40%{box-shadow:0 0 0 8px var(--lime)}100%{box-shadow:0 0 0 0 var(--lime)}}
.dr-nav{display:flex;justify-content:space-between;border-top:1px solid var(--rule);padding-top:18px;font-size:15px;font-weight:500}

/* case overlay */
.case{position:fixed;inset:0;z-index:95;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;visibility:hidden;clip-path:inset(100% 0 0 0);transition:clip-path .8s var(--ease),visibility 0s .8s}
.case.is-open{clip-path:inset(0);visibility:visible;transition:clip-path .8s var(--ease),visibility 0s}
.case-top{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;height:var(--head);padding:0 var(--m);border-bottom:1px solid var(--rule);z-index:2}
.case-body{padding:clamp(40px,6vw,96px) var(--m) clamp(64px,8vw,120px)}
.case-title{grid-column:1/10;font-size:clamp(52px,9vw,168px);font-weight:600;font-stretch:75%;letter-spacing:-.04em;line-height:.86}
.case-specs{grid-column:1/-1;margin-top:36px;border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gut)}
.case-specs div{padding-top:12px}
.case-specs dt{font-size:13px;color:var(--muted)} .case-specs dd{margin:4px 0 0;font-weight:500}
.case-text{grid-column:4/11;margin-top:clamp(40px,5vw,72px)}
.case-imgs{margin-top:clamp(48px,6vw,88px);row-gap:var(--gut)}
.case-imgs .ph{background:var(--grey);display:grid;place-items:center;color:var(--muted);font-size:14px}
.case-imgs .a{grid-column:1/-1;aspect-ratio:16/8}
.case-imgs .b{grid-column:1/6;aspect-ratio:4/5}
.case-imgs .c{grid-column:7/13;aspect-ratio:1/1;margin-top:18%}
.case-next{margin-top:clamp(56px,7vw,110px);border-top:1px solid var(--ink);padding-top:18px;display:flex;justify-content:space-between;align-items:baseline;width:100%;text-align:left}
.case-next b{font-size:clamp(28px,4vw,60px);font-weight:600;font-stretch:80%;letter-spacing:-.03em}

/* about */
.ab-top .h2{grid-column:1/5}
.ab-top p{grid-column:5/13;font-size:clamp(22px,2.3vw,34px);line-height:1.28;letter-spacing:-.015em;max-width:26em}
.phil{margin-top:clamp(72px,9vw,140px)}
.phil-title{grid-column:1/-1;border-top:1px solid var(--ink);padding-top:14px;margin-bottom:clamp(36px,4vw,56px);display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.phil-title h3{font-size:clamp(22px,2vw,30px);font-weight:600;font-stretch:88%;letter-spacing:-.015em}
.phil article{grid-column:span 4}
.phil-n{font-size:clamp(56px,6.4vw,112px);font-weight:500;font-stretch:75%;letter-spacing:-.04em;line-height:.85;font-variant-numeric:tabular-nums}
.phil h4{margin:18px 0 8px;font-size:22px;font-weight:600;font-stretch:88%}
.phil p{max-width:28em;color:rgba(15,20,53,.82)}

/* contact */
.ct{padding-block:clamp(96px,12vw,200px)}
.ct h2{font-size:clamp(52px,10.5vw,196px);font-weight:600;font-stretch:75%;letter-spacing:-.045em;line-height:.84;margin-left:-.03em}
.ct-body{margin-top:clamp(40px,5vw,72px);align-items:end;row-gap:36px}
.ct-body .lead{grid-column:1/6}
.ct-lines{grid-column:7/13;display:grid;gap:6px}
.ct-lines a{font-size:clamp(22px,2.4vw,36px);font-weight:500;font-stretch:88%;letter-spacing:-.02em;justify-self:start}
.ct-cta{grid-column:7/13;display:flex;gap:12px;flex-wrap:wrap}

/* footer */
.foot{background:var(--ink);color:var(--bg);padding:clamp(48px,6vw,88px) var(--m) 28px}
.foot .brand-logo{width:clamp(230px,44vw,540px)}
.foot-grid{margin-top:clamp(36px,4vw,64px);border-top:1px solid rgba(239,239,239,.25);padding-top:18px;row-gap:28px;font-size:15px}
.foot-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
.foot-grid > div{grid-column:auto;display:grid;gap:4px;align-content:start}
.foot .meta{color:rgba(239,239,239,.55)}
.foot-bottom{margin-top:48px;display:flex;justify-content:space-between;gap:20px;color:rgba(239,239,239,.55);font-size:13px}

/* ============ RESPONSIVE ============ */
@media (max-width:1080px){
  .nav{display:none}
  .menu-btn{display:inline-flex;align-items:center}
  .head-side .to-music{display:none}
}
@media (max-width:820px){
  body{font-size:16px}
  .entry-top{grid-template-columns:1fr auto;row-gap:6px}
  .entry-top .wordmark{grid-column:1;grid-row:1}
  .entry-q{grid-column:1/-1;grid-row:2;padding:0}
  .entry-meta{grid-column:2;grid-row:1}
  .split{flex-direction:column}
  .half + .half{border-left:0;border-top:1px solid var(--rule)}
  .half-label{font-size:clamp(46px,15vw,88px);font-stretch:82%}
  .half--music .half-bg,.half--creative .half-bg{opacity:1}
  .half--creative .half-bg{background:repeating-linear-gradient(90deg,rgba(15,20,53,.08) 0 1px,transparent 1px calc(100%/6)),var(--bg)}
  .half--music{color:var(--ivory)}
  .split[data-hover] .half{color:inherit}
  .split[data-hover="creative"] .half--creative,.split[data-hover="music"] .half--music{flex-grow:1}
  .split[data-hover="music"] .half--creative .half-bg,.split[data-hover="creative"] .half--music .half-bg{opacity:1}
  .split[data-hover="creative"] .half--music{color:var(--ivory)}
  .split[data-chosen="creative"] .half--creative,.split[data-chosen="music"] .half--music{flex-grow:40}

  .m-head{flex-direction:column;align-items:flex-start;gap:10px;position:static}
  .m-nav{justify-content:flex-start;gap:14px;font-size:14px}
  .m-nav .sep{display:none}
  .m-hero{min-height:82svh}
  .m-hero .lines{height:52%}
  .m-hero-top{flex-direction:column;gap:6px}
  .m-intro .m-h2,.m-intro p{grid-column:1/-1}
  .m-eq-head .m-h2,.m-eq-head p{grid-column:1/-1}
  .m-eq{column-count:1}
  .m-fig img{aspect-ratio:4/3}
  .m-fig figcaption{flex-direction:column;gap:4px}
  .m-ct-lines,.m-ct-side{grid-column:1/-1}
  .m-foot-grid{grid-template-columns:1fr 1fr}
  .m-foot-bottom{flex-direction:column}

  .g{grid-template-columns:repeat(6,minmax(0,1fr))}
  .hero-top .eyebrow{grid-column:1/-1}
  .hero-top .clock-wrap{grid-column:1/-1;justify-self:start;text-align:left;margin-top:6px}
  .hero h1{grid-column:1/-1;font-size:clamp(46px,13.4vw,92px)}
  .hero-mid{row-gap:28px;align-content:end}
  .hero-fig{grid-column:3/-1;grid-row:1}
  .hero-bottom p,.hero-cta{grid-column:1/-1;justify-self:start}
  .svc-aside,.svc-list{grid-column:1/-1}
  .svc-aside{margin-bottom:28px}
  .w1,.w2,.w3,.w4,.w5{grid-column:1/-1;margin-top:0}
  .w2{grid-column:2/-1}.w3{grid-column:1/6}.w4{grid-column:1/-1}.w5{grid-column:2/-1}
  .w1 .work-tile{aspect-ratio:4/5}.w5 .work-tile{aspect-ratio:4/3}
  .work-over{display:none}
  .sec-head > *{grid-column:1/-1!important;justify-self:start!important}
  .sec-head > .meta{margin-top:10px}
  .cs-head .meta,.cs-head .h2,.cs-intro,.cs-desc{grid-column:1/-1}
  .cs-fig,.cs-cap{grid-column:1/-1}
  .cs-grid{grid-template-columns:1fr}
  .cs-grid img{aspect-ratio:4/3}
  .cs-cap{flex-direction:column;gap:4px}
  .cs-cols article{grid-column:1/-1}
  .pr-head .h2,.pr-head .lead{grid-column:1/-1}
  .pr-head .lead{margin-top:16px}
  .frow{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(var(--m)*-1);padding-inline:var(--m);scrollbar-width:none}
  .frow::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto}
  .frow > .meta{flex:0 0 58px;width:58px}
  .pr-row{grid-template-columns:1fr auto;gap:10px 16px;padding:18px 0}
  .pr-id{grid-column:1;grid-row:1}
  .pr-open{grid-column:1/-1;grid-row:2}
  .pr-open span{max-width:none;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pr-tool{grid-column:2;grid-row:1;justify-self:end;font-size:13px}
  .pr-cat{display:none}
  .pr-acts{grid-column:1/-1;grid-row:3}
  .pr-acts button{min-height:44px;flex:1}
  .case-title,.case-text{grid-column:1/-1}
  .case-specs{grid-template-columns:1fr}
  .case-imgs .a,.case-imgs .b,.case-imgs .c{grid-column:1/-1;margin-top:0}
  .ab-top .h2,.ab-top p{grid-column:1/-1}
  .ab-top p{margin-top:24px}
  .phil article{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;column-gap:20px;border-top:1px solid var(--rule);padding-top:18px}
  .phil article + article{margin-top:28px}
  .phil-n{grid-row:1/3;font-size:64px}
  .phil h4{margin-top:0}
  .phil-title{flex-direction:column;border-top:0;padding-top:0}
  .ct-body .lead,.ct-lines,.ct-cta{grid-column:1/-1}
  .foot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foot-grid > div{grid-column:auto}
  .foot-bottom{flex-direction:column}
}
@media (max-width:480px){
  .foot-grid > div{grid-column:1/-1}
  .hero-fig{grid-column:2/-1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .h-line > span{transform:none}
  .hero-fig .frame,.cs-fig{clip-path:none}
}
</style><main class="wrap sec"><h1>Bu sayfa burada değil.</h1><p>Aradığınız alana buradan devam edebilirsiniz.</p><p><a class="btn" href="/creative/">PAS Creative</a> <a class="btn" href="/music/">PAS Music</a></p></main></html>
